[package]
name = "slantlet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
description = "The Slantlet transform (Selesnick, 1999): an orthogonal, O(N) discrete wavelet-like transform with piecewise-linear basis functions and two vanishing moments."
authors = ["Markus Mayer"]
readme = "README.md"
repository = "https://github.com/sunsided/slantlet"
documentation = "https://docs.rs/slantlet"
keywords = ["slantlet", "wavelet", "transform", "dsp", "signal"]
categories = ["mathematics", "science"]
exclude = ["fuzz/", ".github/", "release.toml"]

[lib]
bench = false # criterion owns `cargo bench` arguments

[package.metadata.docs.rs]
all-features = true

[features]
# Run large transforms on all cores via rayon. Results are bit-identical.
rayon = ["dep:rayon"]
# Frame-wise transform as a WGSL compute shader on any wgpu device (f32).
# Needs Rust 1.87 (wgpu's MSRV).
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
bytemuck = { version = "1.21", optional = true }
pollster = { version = "0.4", optional = true }
rayon = { version = "1.10", optional = true }
wgpu = { version = "30", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
bytemuck = "1.21"

[[bench]]
name = "transforms"
harness = false
