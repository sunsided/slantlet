[package]
name = "slantlet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
slantlet = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "any_input"
path = "fuzz_targets/any_input.rs"
test = false
doc = false
bench = false
