version: '3'

# cargo-fuzz workspace. Included from the root Taskfile as "fuzz:".

vars:
  TARGET: '{{ .TARGET | default "roundtrip" }}'
  SMOKE_SECONDS: '{{ .SMOKE_SECONDS | default "10" }}'

tasks:
  list:
    desc: List fuzz targets
    preconditions: &nightly
      - sh: rustup toolchain list | grep -q nightly
        msg: "Rust nightly toolchain required — rustup toolchain install nightly"
      - sh: command -v cargo-fuzz
        msg: "cargo-fuzz not found — cargo install cargo-fuzz"
    cmds:
      - cargo +nightly fuzz list

  build:
    desc: Build all fuzz targets
    preconditions: *nightly
    cmds:
      - cargo +nightly fuzz build

  run:
    desc: Run one fuzz target (TARGET=roundtrip|any_input, libFuzzer flags after --)
    preconditions: *nightly
    cmds:
      - cargo +nightly fuzz run {{.TARGET}} -- -max_len=65536 {{.CLI_ARGS}}

  smoke:
    desc: Short run of every fuzz target (SMOKE_SECONDS each, default 10)
    preconditions: *nightly
    cmds:
      - for: [roundtrip, any_input]
        cmd: cargo +nightly fuzz run {{.ITEM}} -- -max_len=65536 -max_total_time={{.SMOKE_SECONDS}}

  clean:
    desc: Remove fuzz build output, corpora and artifacts
    cmds:
      - rm -rf target corpus artifacts coverage
